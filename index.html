    <!-- Script com Funções de Raiz Quadrada e Ajustes de Teclado -->
    <script>
        /* State Variables */
        let currentValue = '0';
        let previousValue = null;
        let operation = null;
        let waitingForSecondOperand = false;
        let memoryValue = 0;
        let history = [];
        let soundEnabled = true;

        /* Web Audio API Context */
        let audioCtx = null;

        // Inicializar contexto de áudio com interação
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sintetizador de som de clique físico retrô
        function playRetroClick(type = 'normal') {
            if (!soundEnabled) return;
            initAudio();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'normal') {
                // Clique metálico/plástico rápido
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.03);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);

                osc.start(now);
                osc.stop(now + 0.03);
            } else if (type === 'operator') {
                // Tom um pouco mais agudo para operadores
                osc.type = 'square';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.04);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'clear') {
                // Som duplo rápido para limpar
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        // Feedback de Vibração Hápter
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(12);
            }
        }

        // Registrar ações
        function triggerFeedback(type = 'normal') {
            playRetroClick(type);
            triggerHaptic();
        }

        /* Lógica do Display */
        const mainDisplay = document.getElementById('mainDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');
        const memIndicator = document.getElementById('memIndicator');

        function updateDisplay() {
            // Formatar número para não estourar a tela LCD
            let formatted = currentValue;
            if (formatted.length > 12) {
                const num = parseFloat(formatted);
                if (!isNaN(num)) {
                    formatted = num.toPrecision(8).toString();
                }
            }
            mainDisplay.textContent = formatted;

            // Expressão superior
            if (previousValue !== null && operation !== null) {
                const opSymbol = operation === '*' ? '×' : operation === '/' ? '÷' : operation;
                expressionDisplay.textContent = `${previousValue} ${opSymbol}`;
            } else {
                expressionDisplay.textContent = '';
            }

            // Indicador de memória
            if (memoryValue !== 0) {
                memIndicator.classList.remove('opacity-0');
            } else {
                memIndicator.classList.add('opacity-0');
            }
        }

        /* Entrada de Dígitos */
        function inputDigit(digit) {
            triggerFeedback('normal');
            if (waitingForSecondOperand) {
                currentValue = digit;
                waitingForSecondOperand = false;
            } else {
                currentValue = currentValue === '0' ? digit : currentValue + digit;
            }
            updateDisplay();
        }

        /* Entrada de Ponto Decimal */
        function inputDot() {
            triggerFeedback('normal');
            if (waitingForSecondOperand) {
                currentValue = '0.';
                waitingForSecondOperand = false;
                updateDisplay();
                return;
            }
            if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }

        /* Inversão de Sinal (+/-) */
        function toggleSign() {
            triggerFeedback('normal');
            currentValue = (parseFloat(currentValue) * -1).toString();
            updateDisplay();
        }

        /* Manipulação de Operações */
        function handleOp(nextOp) {
            triggerFeedback('operator');
            const inputValue = parseFloat(currentValue);

            if (nextOp === '%' && previousValue !== null) {
                // Porcentagem baseada no valor anterior
                const percentVal = (previousValue * inputValue) / 100;
                currentValue = percentVal.toString();
                updateDisplay();
                return;
            } else if (nextOp === '%') {
                currentValue = (inputValue / 100).toString();
                updateDisplay();
                return;
            }

            if (previousValue === null) {
                previousValue = inputValue;
            } else if (operation) {
                const result = performCalculation(previousValue, inputValue, operation);
                currentValue = String(result);
                previousValue = result;
            }

            waitingForSecondOperand = true;
            operation = nextOp;
            updateDisplay();
        }

        /* Cálculo Principal */
        function performCalculation(first, second, op) {
            switch (op) {
                case '+': return first + second;
                case '-': return first - second;
                case '*': return first * second;
                case '/': return second !== 0 ? first / second : 'ERRO';
                default: return second;
            }
        }

        function calculate() {
            triggerFeedback('operator');
            if (operation === null || waitingForSecondOperand) return;

            const inputValue = parseFloat(currentValue);
            const result = performCalculation(previousValue, inputValue, operation);

            const opSymbol = operation === '*' ? '×' : operation === '/' ? '÷' : operation;
            const historyEntry = `${previousValue} ${opSymbol} ${inputValue} = ${result}`;
            
        // Função de Raiz Quadrada
        function handleSqrt() {
            triggerFeedback('operator');
            const current = parseFloat(currentValue);
            if (current < 0) {
                currentValue = 'ERRO';
            } else {
                const result = Math.sqrt(current);
                const historyEntry = `√(${current}) = ${result}`;
                addHistory(historyEntry);
                currentValue = String(result);
            }
            waitingForSecondOperand = true;
            updateDisplay();
        }

        /* Suporte ao Teclado Físico Ampliado */
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
            if (e.key === '.' || e.key === ',') inputDot();
            if (e.key === '+' || e.key === '-') handleOp(e.key);
            if (e.key === '*') handleOp('*');
            if (e.key === '/') handleOp('/');
            if (e.key === '%') handleOp('%');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') clearEntry();
            if (e.key === 'r' || e.key === 'R') handleSqrt();
        });

        // Inicializar Display na Carga
        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>
